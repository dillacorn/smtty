name: Release smtty v14.0

on:
  pull_request:
    branches:
      - main
    paths:
      - .release-v14-trigger

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/publish-v14-release'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish v14.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release-v14.sh
