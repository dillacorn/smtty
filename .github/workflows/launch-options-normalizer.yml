name: Finalize compact prompt tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update aligned-action assertions
        run: python3 tools/finalize-compact-prompt-tests.py

      - name: Check Bash syntax
        run: |
          bash -n smtty
          bash -n tests/test-launch-options-normalizer.sh
          bash -n tests/test-compact-ui.sh
          bash -n tests/test-compact-prompts.sh

      - name: Run test suites
        run: |
          bash tests/test-launch-options-normalizer.sh
          bash tests/test-compact-ui.sh
          bash tests/test-compact-prompts.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck -S error smtty tests/test-launch-options-normalizer.sh tests/test-compact-ui.sh tests/test-compact-prompts.sh

      - name: Check whitespace
        run: git diff --check

      - name: Commit test finalization
        run: |
          if git diff --quiet -- tests/test-compact-ui.sh; then
            echo "Compact UI assertions already finalized"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test-compact-ui.sh
          git commit -m "test: verify padded compact action rows"
          git push origin HEAD:${{ github.head_ref }}
