name: Apply Flatpak environment forwarding

on:
  push:
    branches:
      - agent/normalize-launch-options

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply Flatpak forwarding patch
        run: python3 tools/apply-flatpak-env-forwarding.py

      - name: Check Bash syntax
        run: |
          bash -n smtty
          bash -n tests/test-launch-options-normalizer.sh

      - name: Run launch-option parser cases
        run: bash tests/test-launch-options-normalizer.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck error pass
        run: shellcheck -S error smtty tests/test-launch-options-normalizer.sh

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit Flatpak forwarding patch
        run: |
          if git diff --quiet -- smtty tests/test-launch-options-normalizer.sh; then
            echo "Flatpak forwarding is already patched"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smtty tests/test-launch-options-normalizer.sh
          git commit -m "fix: forward launch environment through Flatpak"
          git push origin HEAD:${{ github.ref_name }}
