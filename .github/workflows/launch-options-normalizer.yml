name: Refine compact terminal UI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply compact UI patch
        run: |
          python3 tools/apply-compact-ui.py
          python3 tools/refine-compact-ui.py

      - name: Check Bash syntax
        run: |
          bash -n smtty
          bash -n tests/test-launch-options-normalizer.sh
          bash -n tests/test-compact-ui.sh

      - name: Run test suites
        run: |
          bash tests/test-launch-options-normalizer.sh
          bash tests/test-compact-ui.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck error pass
        run: shellcheck -S error smtty tests/test-launch-options-normalizer.sh tests/test-compact-ui.sh

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit compact UI refinements
        run: |
          if git diff --quiet -- smtty; then
            echo "Compact UI is already refined"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smtty
          git commit -m "refine: tighten compact dashboard labels"
          git push origin HEAD:${{ github.head_ref }}
