name: Restore smtty executable bit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore executable bit
        run: chmod +x smtty

      - name: Check executable mode
        run: test -x smtty

      - name: Check Bash syntax
        run: |
          bash -n smtty
          bash -n tests/test-launch-options-normalizer.sh
          bash -n tests/test-compact-ui.sh
          bash -n tests/test-compact-prompts.sh

      - name: Run test suites
        run: |
          bash tests/test-launch-options-normalizer.sh
          bash tests/test-compact-ui.sh
          bash tests/test-compact-prompts.sh

      - name: Commit executable mode
        run: |
          if git diff --quiet -- smtty; then
            echo "smtty is already executable"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smtty
          git commit -m "fix: restore smtty executable bit"
          git push origin HEAD:${{ github.head_ref }}
