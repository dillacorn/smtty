name: Compact selection prompts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply compact prompt pass
        run: python3 tools/compact-selection-prompts.py

      - name: Check Bash syntax
        run: |
          bash -n smtty
          bash -n tests/test-launch-options-normalizer.sh
          bash -n tests/test-compact-ui.sh
          bash -n tests/test-compact-prompts.sh

      - name: Run test suites
        run: |
          bash tests/test-launch-options-normalizer.sh
          bash tests/test-compact-ui.sh
          bash tests/test-compact-prompts.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck -S error smtty tests/test-launch-options-normalizer.sh tests/test-compact-ui.sh tests/test-compact-prompts.sh

      - name: Check whitespace
        run: git diff --check

      - name: Commit compact prompts
        run: |
          if git diff --quiet -- smtty tests/test-compact-prompts.sh; then
            echo "Compact prompt pass already applied"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smtty tests/test-compact-prompts.sh
          git commit -m "refine: compact setup prompts and align actions"
          git push origin HEAD:${{ github.head_ref }}
